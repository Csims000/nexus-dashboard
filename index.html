<style>

*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}body{min-height:100vh;overflow-x:hidden;background:radial-gradient(ellipse at 15% 0%,rgba(35,91,174,.19),transparent 42%),radial-gradient(ellipse at 100% 70%,rgba(28,76,156,.13),transparent 40%),var(--bg)}button,input{font:inherit}button{color:inherit;cursor:pointer}button:focus-visible,input:focus-visible{outline:2px solid var(--cyan);outline-offset:3px}.energy{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0;opacity:.6}.wave{position:absolute;width:130vw;height:55vh;left:-15vw;border:1px solid rgba(69,147,255,.12);border-radius:50%;filter:drop-shadow(0 0 12px rgba(48,131,255,.16));transform:rotate(-12deg);animation:drift 22s ease-in-out infinite alternate}.wave:nth-child(1){top:10%;}.wave:nth-child(2){top:17%;left:-25vw;animation-duration:29s;border-color:rgba(67,215,255,.1)}.wave:nth-child(3){top:24%;left:-5vw;animation-duration:25s}.wave:nth-child(4){top:65%;left:-25vw;animation-duration:32s}.wave:after{content:"";position:absolute;inset:18px;border:1px solid rgba(74,151,255,.08);border-radius:50%}@keyframes drift{from{transform:translate3d(-2%,0,0) rotate(-12deg)}to{transform:translate3d(3%,-3%,0) rotate(-8deg)}}.app{position:relative;z-index:1;max-width:1450px;margin:auto;padding:18px 28px 20px;min-height:100vh;display:flex;flex-direction:column;gap:14px}.topbar{display:flex;align-items:center;gap:16px;min-height:54px}.brand{display:flex;align-items:center;gap:11px;border:0;background:transparent;padding:0;text-align:left}.logo{width:42px;height:42px;filter:drop-shadow(0 0 10px rgba(83,160,255,.35))}.brand-name{font-size:19px;font-weight:850;letter-spacing:.23em}.brand-sub{font-size:10px;color:var(--muted);letter-spacing:.13em;margin-top:3px}.top-spacer{flex:1}.clock{text-align:right;min-width:130px}.clock-time{font-size:19px;font-weight:750;letter-spacing:.04em;font-variant-numeric:tabular-nums}.clock-date{font-size:11px;color:var(--muted);margin-top:2px}.icon-btn{height:38px;width:38px;display:grid;place-items:center;border:1px solid var(--line);border-radius:12px;background:rgba(18,28,46,.8);transition:.2s}.icon-btn:hover,.launch:hover,.tool:hover{border-color:rgba(110,168,254,.6);box-shadow:0 0 22px rgba(65,133,242,.12);transform:translateY(-2px)}.avatar{height:36px;width:36px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,#244d89,#15243f);border:1px solid rgba(110,168,254,.5);font-weight:750;color:#dceaff}.hero{text-align:center;padding:3px 0 1px}.eyebrow{font-size:10px;letter-spacing:.25em;color:var(--blue);font-weight:750;text-transform:uppercase}.hero h1{font-size:clamp(23px,2.7vw,34px);letter-spacing:-.04em;margin:7px 0 12px}.search-wrap{max-width:680px;margin:0 auto;position:relative}.search-icon{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--muted)}#search{width:100%;height:48px;border:1px solid rgba(110,168,254,.24);border-radius:15px;background:rgba(15,24,41,.91);padding:0 82px 0 46px;color:var(--text);box-shadow:0 0 28px rgba(34,105,209,.08)}#search::placeholder{color:#7788a5}.shortcut{position:absolute;right:10px;top:50%;transform:translateY(-50%);border:1px solid var(--line);border-radius:6px;color:var(--muted);font-size:10px;padding:4px 6px}.tool-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.tool{min-height:91px;display:flex;align-items:center;gap:13px;padding:16px;border:1px solid var(--line);border-radius:16px;background:linear-gradient(135deg,rgba(21,31,51,.96),rgba(14,22,37,.95));box-shadow:var(--shadow);text-align:left;transition:transform .2s,border-color .2s,box-shadow .2s}.tool-icon{width:43px;height:43px;display:grid;place-items:center;flex-shrink:0;border-radius:13px;background:rgba(75,133,222,.13);color:var(--blue)}.tool:nth-child(2) .tool-icon{color:#8de5c0;background:rgba(72,199,147,.12)}.tool:nth-child(3) .tool-icon{color:#c1a5ff;background:rgba(160,115,245,.13)}.tool:nth-child(4) .tool-icon{color:#7de8f4;background:rgba(64,197,221,.12)}.tool-title{font-weight:720;font-size:14px}.tool-desc{font-size:11px;color:var(--muted);margin-top:5px}.layout{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(280px,.85fr);gap:14px;flex:1;min-height:0}.panel{background:linear-gradient(145deg,rgba(18,28,46,.95),rgba(13,21,36,.94));border:1px solid var(--line);border-radius:17px;padding:16px;box-shadow:var(--shadow);min-width:0}.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:13px}.panel-title{font-size:14px;font-weight:760;display:flex;align-items:center;gap:8px}.panel-note{font-size:10px;color:var(--muted)}.launch-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:9px}.launch{border:1px solid var(--line);border-radius:13px;background:rgba(22,33,53,.78);min-height:86px;padding:12px 5px 9px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;transition:.2s;min-width:0}.launch-icon{width:29px;height:29px;display:grid;place-items:center;border-radius:9px;background:rgba(91,151,247,.12);color:#9bc2ff}.launch-name{font-size:10px;color:#cbd6e9;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}.add-launch{border-style:dashed;color:var(--muted)}.myday-list{display:flex;flex-direction:column;gap:9px}.day-item{display:flex;align-items:center;gap:10px;padding:11px;border:1px solid rgba(139,174,231,.1);border-radius:12px;background:rgba(20,31,51,.55)}.day-dot{width:8px;height:8px;border-radius:50%;background:var(--blue);box-shadow:0 0 10px rgba(110,168,254,.5);flex-shrink:0}.day-copy{min-width:0;flex:1}.day-main{font-size:12px;font-weight:650}.day-sub{font-size:10px;color:var(--muted);margin-top:4px}.tiny-btn{border:1px solid var(--line);background:rgba(25,39,63,.75);border-radius:8px;padding:6px 9px;font-size:10px;color:#b7c9e8}.tiny-btn:hover{border-color:var(--blue)}.panel-foot{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.recent-row{display:flex;align-items:center;gap:8px;margin-top:11px;color:var(--muted);font-size:10px}.recent-row svg{color:var(--blue)}.footer{display:flex;align-items:center;justify-content:space-between;gap:12px;color:#667895;font-size:10px;padding:1px 2px}.status{display:flex;align-items:center;gap:6px}.status-dot{width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 8px rgba(113,227,177,.55)}.toast{position:fixed;bottom:20px;left:50%;transform:translate(-50%,20px);opacity:0;pointer-events:none;padding:11px 16px;border-radius:12px;background:#1b2b45;border:1px solid rgba(110,168,254,.35);box-shadow:var(--shadow);font-size:12px;transition:.25s;z-index:10}.toast.show{opacity:1;transform:translate(-50%,0)}.modal-backdrop{position:fixed;inset:0;display:none;place-items:center;padding:20px;background:rgba(3,7,15,.72);backdrop-filter:blur(10px);z-index:20}.modal-backdrop.open{display:grid}.modal{width:min(420px,100%);padding:22px;border:1px solid rgba(110,168,254,.3);border-radius:18px;background:#111a2b;box-shadow:0 24px 80px #0008}.modal h2{margin:0 0 7px;font-size:18px}.modal p{font-size:12px;color:var(--muted);line-height:1.6;margin:0 0 15px}.field{display:flex;flex-direction:column;gap:6px;margin:12px 0}.field label{font-size:11px;color:#a9bad4}.field input{height:40px;border:1px solid var(--line);background:#0b1220;border-radius:9px;padding:0 11px;color:var(--text)}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.primary{background:linear-gradient(135deg,#4389ef,#2965cb);border:1px solid #72adff;border-radius:9px;padding:9px 13px;font-size:12px;font-weight:700}.secondary{background:transparent;border:1px solid var(--line);border-radius:9px;padding:9px 13px;font-size:12px}.light{color-scheme:light;--bg:#edf3fc;--panel:#fff;--panel2:#f6f9ff;--line:rgba(46,79,130,.17);--text:#15243c;--muted:#64748c;--shadow:0 14px 38px rgba(45,73,118,.1);background:radial-gradient(ellipse at 15% 0%,rgba(82,145,255,.18),transparent 42%),#edf3fc}.light .tool,.light .panel{background:rgba(255,255,255,.88)}.light #search,.light .launch,.light .day-item,.light .icon-btn{background:rgba(255,255,255,.9)}.light .launch-name{color:#334764}.light .wave{opacity:.45}.light .modal{background:#fff}.light .field input{background:#f4f7fc;color:#15243c}.reduced-motion *, .reduced-motion *:before,.reduced-motion *:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
@media(min-width:1100px) and (min-height:700px){.app{height:100vh;min-height:650px;max-height:1000px;overflow:hidden}.layout{grid-template-rows:1fr}.left-panel,.right-panel{min-height:0}.right-panel{display:flex;flex-direction:column}.myday-list{gap:8px}.panel{padding:15px}.launch{min-height:80px}}

<script>
const $=s=>document.querySelector(s);
const DEFAULT_LINKS=[
 {name:"GitHub",url:"https://github.com",icon:"GH"},{name:"Cloudflare",url:"https://dash.cloudflare.com",icon:"CF"},{name:"OpenRouter",url:"https://openrouter.ai",icon:"OR"},{name:"Hugging Face",url:"https://huggingface.co",icon:"HF"},{name:"Schoolwork Hub",url:"https://csims000.github.io/schoolwork-hub/",icon:"SH"}
];
const DEFAULT_TASKS=[{title:"Set up your NEXUS workspace",detail:"Your first milestone",done:false},{title:"Connect Cloudflare Pages",detail:"Publish your dashboard",done:false},{title:"Customize your quick links",detail:"Make it yours",done:false}];
let links=load("nexus.links",DEFAULT_LINKS),tasks=load("nexus.tasks",DEFAULT_TASKS),settings=load("nexus.settings",{theme:"dark",reducedMotion:false,displayName:"N",clock24:false}),recent="";
function load(k,f){try{const v=JSON.parse(localStorage.getItem(k));return v??f}catch{return f}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}
function toast(msg){const t=$("#toast");t.textContent=msg;t.classList.add("show");clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.classList.remove("show"),2600)}
function safeUrl(raw){try{const u=new URL(raw);return ["https:","http:"].includes(u.protocol)?u.href:null}catch{return null}}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function iconSvg(kind){const paths={GH:'<path d="M12 2a10 10 0 0 0-3.16 19.49c.5.09.68-.22.68-.48v-1.7c-2.78.6-3.37-1.18-3.37-1.18-.45-1.16-1.11-1.47-1.11-1.47-.91-.62.07-.61.07-.61 1 .07 1.53 1.03 1.53 1.03.9 1.53 2.35 1.09 2.92.83.09-.65.35-1.09.63-1.34-2.22-.25-4.55-1.11-4.55-4.95 0-1.09.39-1.99 1.03-2.69-.1-.25-.45-1.27.1-2.65 0 0 .84-.27 2.75 1.03A9.6 9.6 0 0 1 12 6.91c.85 0 1.7.11 2.5.34 1.91-1.3 2.75-1.03 2.75-1.03.55 1.38.2 2.4.1 2.65.64.7 1.03 1.6 1.03 2.69 0 3.85-2.33 4.7-4.56 4.95.36.31.68.92.68 1.85v2.65c0 .26.18.57.69.48A10 10 0 0 0 12 2Z"/>',CF:'<path d="M6 17a4 4 0 0 1-.2-8 6.5 6.5 0 0 1 12.5 1.5A3.5 3.5 0 0 1 18 17H6Z"/>',OR:'<circle cx="12" cy="12" r="8"/><path d="M4 12h16M12 4a12 12 0 0 1 0 16M12 4a12 12 0 0 0 0 16"/>',HF:'<path d="M4 7v10m16-10v10M4 12h16M8 7l4 5 4-5M8 17l4-5 4 5"/>',SH:'<path d="M4 5h16v14H4zM8 9h8M8 12h8M8 15h5"/>'};
return '<svg viewBox="0 0 24 24" width="23" height="23" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">'+(paths[kind]||'<path d="M5 12h14M12 5l7 7-7 7"/>')+'</svg>'}
function renderLinks(){const grid=$("#launchGrid");grid.innerHTML="";links.forEach((l,i)=>{const b=document.createElement("button");b.className="launch";b.innerHTML='<span class="launch-icon">'+iconSvg(l.icon||"")+'</span><span class="launch-name">'+escapeHtml(l.name)+'</span>';b.title=l.url;b.addEventListener("click",()=>{const url=safeUrl(l.url);if(!url)return toast("That link is not valid.");recent=l.name;$("#recentText").textContent="Last launched: "+l.name;window.open(url,"_blank","noopener,noreferrer")});grid.appendChild(b)});const add=document.createElement("button");add.className="launch add-launch";add.innerHTML='<span class="launch-icon"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 5v14M5 12h14"/></svg></span><span class="launch-name">Add shortcut</span>';add.onclick=()=>openLinkModal();grid.appendChild(add)}
function renderTasks(){const list=$("#mydayList");list.innerHTML="";tasks.slice(0,4).forEach((t,i)=>{const row=document.createElement("div");row.className="day-item";row.innerHTML='<span class="day-dot" style="'+(t.done?'background:var(--green);box-shadow:none':'')+'"></span><div class="day-copy"><div class="day-main" style="'+(t.done?'text-decoration:line-through;opacity:.6':'')+'">'+escapeHtml(t.title)+'</div><div class="day-sub">'+escapeHtml(t.detail||"Priority task")+'</div></div><button class="tiny-btn" aria-label="'+(t.done?'Mark incomplete':'Complete task')+'">'+(t.done?'✓':'○')+'</button>';row.querySelector("button").onclick=()=>{tasks[i].done=!tasks[i].done;save("nexus.tasks",tasks);renderTasks()};list.appendChild(row)});if(!tasks.length)list.innerHTML='<div class="day-item"><div class="day-copy"><div class="day-main">Your day is clear</div><div class="day-sub">Add a priority to get started.</div></div></div>'}
function updateClock(){const d=new Date();$("#clockTime").textContent=new Intl.DateTimeFormat(undefined,{hour:"2-digit",minute:"2-digit",hour12:!settings.clock24}).format(d);$("#clockDate").textContent=new Intl.DateTimeFormat(undefined,{weekday:"short",month:"short",day:"numeric"}).format(d);$("#dayLabel").textContent=new Intl.DateTimeFormat(undefined,{weekday:"long"}).format(d).toUpperCase()}
function applySettings(){document.body.classList.toggle("light",settings.theme==="light");document.body.classList.toggle("reduced-motion",!!settings.reducedMotion);$("#avatar").textContent=(settings.displayName||"N").trim().slice(0,1).toUpperCase()||"N";updateClock()}
let modalSave=()=>{};
function openModal(title,desc,body,saveFn){$("#modalTitle").textContent=title;$("#modalDesc").textContent=desc;$("#modalBody").innerHTML=body;modalSave=saveFn||(()=>{});$("#modalBackdrop").classList.add("open");const first=$("#modalBody input");if(first)first.focus()}
function closeModal(){$("#modalBackdrop").classList.remove("open")}
$("#cancelModal").onclick=closeModal;$("#modalBackdrop").addEventListener("click",e=>{if(e.target===$("#modalBackdrop"))closeModal()});$("#saveModal").onclick=()=>{modalSave();closeModal()};
function openLinkModal(){
  const currentNames = links.map(l => escapeHtml(l.name)).join(" · ");
  const options = links.map((l,i) => '<option value="' + i + '">' + escapeHtml(l.name) + '</option>').join("");
  const body = '<div class="field"><label for="linkName">Shortcut name</label><input id="linkName" maxlength="24" placeholder="My website"></div>' +
    '<div class="field"><label for="linkUrl">Website URL</label><input id="linkUrl" type="url" placeholder="https://example.com"></div>' +
    '<div class="field"><label for="linkIcon">Icon letters (2 characters)</label><input id="linkIcon" maxlength="2" placeholder="NX"></div>' +
    '<p>Current shortcuts: ' + currentNames + '</p>' +
    '<div class="field"><label for="removeLink">Remove a shortcut (optional)</label><select id="removeLink" style="height:38px;background:#0b1220;color:var(--text);border:1px solid var(--line);border-radius:9px;padding:0 9px"><option value="">Keep all shortcuts</option>' + options + '</select></div>';
  openModal("Manage Quick Launch", "Add a site shortcut. Use a full https:// address for the safest result.", body, () => {
    const removeValue = $("#removeLink").value;
    if (removeValue !== "") {
      links.splice(Number(removeValue), 1);
      save("nexus.links", links);
      renderLinks();
    }
    const name = $("#linkName").value.trim();
    const url = safeUrl($("#linkUrl").value.trim());
    if (name && url) {
      links.push({name, url, icon: ($("#linkIcon").value.trim().toUpperCase() || name.slice(0, 2).toUpperCase())});
      save("nexus.links", links);
      renderLinks();
      toast("Shortcut added.");
    } else if (name || $("#linkUrl").value.trim()) {
      toast("Enter both a name and a valid URL.");
    }
  });
}
$("#manageLaunch").onclick=openLinkModal;$("#addTask").onclick=()=>openModal("Add a priority","Keep it short so your dashboard stays tidy.",'<div class="field"><label for="taskName">Task</label><input id="taskName" maxlength="70" placeholder="What needs to get done?"></div><div class="field"><label for="taskDetail">Small note (optional)</label><input id="taskDetail" maxlength="80" placeholder="Due date, project, or next step"></div>',()=>{const title=$("#taskName").value.trim();if(!title)return toast("Enter a task first.");tasks.unshift({title,detail:$("#taskDetail").value.trim()||"Priority task",done:false});tasks=tasks.slice(0,8);save("nexus.tasks",tasks);renderTasks();toast("Priority added.")});
$("#settingsBtn").onclick=()=>openModal("NEXUS settings","Personalize this browser's dashboard. These preferences are stored locally on this device.",'<div class="field"><label for="displayName">Display initial / profile label</label><input id="displayName" maxlength="24" value="'+escapeHtml(settings.displayName||"N")+'"></div><div class="field"><label for="themeSelect">Theme</label><select id="themeSelect" style="height:40px;background:#0b1220;color:var(--text);border:1px solid var(--line);border-radius:9px;padding:0 10px"><option value="dark" '+(settings.theme==="dark"?"selected":"")+'>Midnight dark</option><option value="light" '+(settings.theme==="light"?"selected":"")+'>Light</option></select></div><div class="field"><label><input id="motionToggle" type="checkbox" '+(settings.reducedMotion?"checked":"")+' style="width:auto;height:auto;margin-right:8px">Reduce animations</label></div><div class="field"><label><input id="clockToggle" type="checkbox" '+(settings.clock24?"checked":"")+' style="width:auto;height:auto;margin-right:8px">Use 24-hour clock</label></div>',()=>{settings={...settings,displayName:$("#displayName").value.trim()||"N",theme:$("#themeSelect").value,reducedMotion:$("#motionToggle").checked,clock24:$("#clockToggle").checked};save("nexus.settings",settings);applySettings();toast("Settings saved on this device.")});
$("#themeBtn").onclick=()=>{settings.theme=settings.theme==="light"?"dark":"light";save("nexus.settings",settings);applySettings();toast(settings.theme==="light"?"Light theme enabled":"Midnight theme enabled")};
$("#exportBtn").onclick=()=>{const data={exportedAt:new Date().toISOString(),settings,links,tasks};const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="nexus-dashboard-backup.json";a.click();URL.revokeObjectURL(a.href);toast("Dashboard backup exported.")};
$("#calendarBtn").onclick=()=>toast("Calendar is planned for the next build stage.");
$("#homeBtn").onclick=()=>{window.scrollTo({top:0,behavior:settings.reducedMotion?"auto":"smooth"});$("#search").focus()};

/* NEXUS tool modules: weather, AI provider, files and full task manager. */
let nexusWeatherCache=null, nexusAIKey="", nexusAIModel="heygen/heygen-voice-1-turbo:free";
function moduleModal(title,desc,html,saveFn){openModal(title,desc,html,saveFn||(()=>{}))}
function openWeather(){
 moduleModal("Weather","Live weather from Open-Meteo. Enter a city to check current conditions; no API key is needed.",
 '<div class="field"><label for="weatherCity">City or town</label><input id="weatherCity" placeholder="e.g. North Richland Hills, TX"></div><div id="weatherResult" style="font-size:13px;line-height:1.7;color:var(--muted)">Enter a city, then press Get weather.</div><div class="modal-actions" style="justify-content:flex-start;margin-top:8px"><button class="primary" type="button" id="getWeatherBtn">Get weather</button></div>',
 ()=>{});
 $("#saveModal").style.display="none";
 $("#getWeatherBtn").onclick=async()=>{
   const city=$("#weatherCity").value.trim(); if(!city){$("#weatherResult").textContent="Enter a city first.";return}
   $("#weatherResult").textContent="Loading weather…";
   try{
    const g=await fetch("https://geocoding-api.open-meteo.com/v1/search?name="+encodeURIComponent(city)+"&count=1&language=en&format=json");
    if(!g.ok)throw new Error("City search is unavailable right now.");
    const gd=await g.json(); if(!gd.results||!gd.results.length)throw new Error("Couldn't find that city. Try adding the state or country.");
    const place=gd.results[0];
    const w=await fetch("https://api.open-meteo.com/v1/forecast?latitude="+place.latitude+"&longitude="+place.longitude+"&current=temperature_2m,relative_humidity_2m,apparent_temperature,is_day,precipitation,weather_code,wind_speed_10m&temperature_unit=fahrenheit&wind_speed_unit=mph&timezone=auto");
    if(!w.ok)throw new Error("Weather data is unavailable.");
    const d=await w.json(),v=d.current,labels={0:"Clear sky",1:"Mainly clear",2:"Partly cloudy",3:"Overcast",45:"Fog",48:"Rime fog",51:"Light drizzle",53:"Drizzle",55:"Heavy drizzle",61:"Light rain",63:"Rain",65:"Heavy rain",71:"Light snow",73:"Snow",75:"Heavy snow",80:"Rain showers",81:"Rain showers",82:"Heavy rain showers",95:"Thunderstorm",96:"Thunderstorm with hail",99:"Severe thunderstorm"};
    nexusWeatherCache={place,v,condition:labels[v.weather_code]||"Current conditions"};
    $("#weatherResult").innerHTML="<strong style='color:var(--text);font-size:16px'>"+escapeHtml(place.name+(place.admin1?", "+place.admin1:"")+(place.country?", "+place.country:""))+"</strong><div style='font-size:28px;color:var(--cyan);font-weight:800;margin-top:8px'>"+Math.round(v.temperature_2m)+"°F</div><div>"+escapeHtml(labels[v.weather_code]||"Current conditions")+"</div><div>Feels like "+Math.round(v.apparent_temperature)+"°F · Humidity "+v.relative_humidity_2m+"%</div><div>Wind "+Math.round(v.wind_speed_10m)+" mph · Precipitation "+v.precipitation+" mm</div><div style='font-size:10px;margin-top:8px'>Updated "+escapeHtml(v.time.replace("T"," "))+" · Source: Open-Meteo</div>";
   }catch(e){$("#weatherResult").textContent=e.message||"Couldn't load weather. Check your connection and try again."}
 };
}
function openAIProvider(){
 moduleModal("AI Provider","OpenRouter model selected: heygen/heygen-voice-1-turbo:free. Enter your OpenRouter API key for this session. Never paste a private key on a shared device.",
 '<div class="field"><label for="aiProviderSelect">Provider</label><select id="aiProviderSelect" style="height:40px;width:100%;background:#0b1220;color:var(--text);border:1px solid var(--line);border-radius:9px;padding:0 10px"><option value="openrouter">OpenRouter API</option><option value="chatgpt">ChatGPT website</option><option value="claude">Claude website</option><option value="gemini">Google Gemini website</option><option value="huggingface">Hugging Face</option></select></div><div class="field"><label for="aiModel">OpenRouter model ID</label><input id="aiModel" value="heygen/heygen-voice-1-turbo:free" placeholder="heygen/heygen-voice-1-turbo:free"></div><div class="field"><label for="aiKey">OpenRouter API key (session only)</label><input id="aiKey" type="password" autocomplete="off" placeholder="sk-or-…"></div><div id="aiChatArea" style="display:block"><div id="aiMessages" style="max-height:180px;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:10px;margin:10px 0;font-size:12px;white-space:pre-wrap">Enter your OpenRouter key, then send a message. Check that this model supports the kind of request you want.</div><div class="field"><label for="aiPrompt">Message</label><input id="aiPrompt" placeholder="Ask something…"></div><button class="primary" type="button" id="aiSend">Send to AI</button></div><p style="font-size:11px">OpenRouter usage and model availability can change. Check pricing before sending requests. The API key is not saved by NEXUS.</p>',
 ()=>{nexusAIModel=$("#aiModel").value.trim()||"heygen/heygen-voice-1-turbo:free";nexusAIKey=$("#aiKey").value.trim();});
 $("#saveModal").style.display="none";
 $("#aiSend").onclick=async()=>{
  nexusAIModel=$("#aiModel").value.trim()||"heygen/heygen-voice-1-turbo:free";
  nexusAIKey=$("#aiKey").value.trim();
  const prompt=$("#aiPrompt").value.trim(),area=$("#aiMessages");
  if(!prompt){toast("Type a message first.");return}
  if($("#aiProviderSelect").value!=="openrouter"){const urls={chatgpt:"https://chatgpt.com/",claude:"https://claude.ai/",gemini:"https://gemini.google.com/",huggingface:"https://huggingface.co/chat/"};window.open(urls[$("#aiProviderSelect").value],"_blank","noopener,noreferrer");return}
  if(!nexusAIKey){area.textContent="Enter your OpenRouter API key first.";return}
  area.textContent=area.textContent+"\\n\\nYou: "+prompt+"\\nNEXUS: Thinking…";$("#aiPrompt").value="";
  try{const resp=await fetch("https://openrouter.ai/api/v1/chat/completions",{method:"POST",headers:{"Authorization":"Bearer "+nexusAIKey,"Content-Type":"application/json"},body:JSON.stringify({model:nexusAIModel,messages:[{role:"user",content:prompt}]})});const data=await resp.json();if(!resp.ok)throw new Error(data.error?.message||"API request failed");area.textContent=area.textContent.replace("NEXUS: Thinking…","NEXUS: "+(data.choices?.[0]?.message?.content||"No response"))}catch(e){area.textContent=area.textContent+"\\nError: "+e.message}area.scrollTop=area.scrollHeight;
 };
 $("#saveModal").style.display="none";
}
function openTasksManager(){
 const list=tasks.map((t,i)=>'<div class="day-item" style="margin:8px 0"><button class="tiny-btn" data-task-toggle="'+i+'" aria-label="Toggle task">'+(t.done?"✓":"○")+'</button><div class="day-copy"><div class="day-main" style="'+(t.done?"text-decoration:line-through;opacity:.65":"")+'">'+escapeHtml(t.title)+'</div><div class="day-sub">'+escapeHtml(t.detail||"Task")+'</div></div><button class="tiny-btn" data-task-delete="'+i+'" aria-label="Delete task">Delete</button></div>').join("");
 moduleModal("My Tasks","Your tasks are saved in this browser on this device. Add, complete, or delete tasks below.",'<div id="taskManagerList">'+(list||'<p>No tasks yet. Add your first task below.</p>')+'</div><div class="field"><label for="managerTaskName">New task</label><input id="managerTaskName" maxlength="100" placeholder="What needs to get done?"></div><div class="field"><label for="managerTaskDetail">Details (optional)</label><input id="managerTaskDetail" maxlength="120" placeholder="Due date or next step"></div><button class="primary" type="button" id="managerAddTask">+ Add task</button>',()=>{});
 $("#saveModal").style.display="none";
 $("#managerAddTask").onclick=()=>{const title=$("#managerTaskName").value.trim();if(!title){toast("Enter a task first.");return}tasks.unshift({title,detail:$("#managerTaskDetail").value.trim()||"Task",done:false});save("nexus.tasks",tasks);closeModal();renderTasks();toast("Task added.")};
 document.querySelectorAll("[data-task-toggle]").forEach(b=>b.onclick=()=>{tasks[Number(b.dataset.taskToggle)].done=!tasks[Number(b.dataset.taskToggle)].done;save("nexus.tasks",tasks);closeModal();renderTasks();openTasksManager()});
 document.querySelectorAll("[data-task-delete]").forEach(b=>b.onclick=()=>{tasks.splice(Number(b.dataset.taskDelete),1);save("nexus.tasks",tasks);closeModal();renderTasks();openTasksManager()});
}
const FILE_DB="nexus-files-v1";
function openFileDB(){return new Promise((resolve,reject)=>{const req=indexedDB.open(FILE_DB,1);req.onupgradeneeded=()=>req.result.createObjectStore("files",{keyPath:"id",autoIncrement:true});req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}
async function listNexusFiles(){const db=await openFileDB();return new Promise((resolve,reject)=>{const req=db.transaction("files","readonly").objectStore("files").getAll();req.onsuccess=()=>resolve(req.result||[]);req.onerror=()=>reject(req.error)})}
async function openFiles(){
 let fileRows=[];try{fileRows=await listNexusFiles()}catch(e){toast("This browser doesn't support local file storage.");return}
 const render=rows=>rows.length?rows.map(f=>'<div class="day-item" style="margin:8px 0"><div class="day-copy"><div class="day-main">'+escapeHtml(f.name)+'</div><div class="day-sub">'+(f.size/1024).toFixed(1)+' KB · '+escapeHtml(new Date(f.added).toLocaleDateString())+'</div></div><button class="tiny-btn" data-file-download="'+f.id+'">Download</button><button class="tiny-btn" data-file-delete="'+f.id+'">Delete</button></div>').join(""):'<p id="emptyFiles" style="font-size:12px;color:var(--muted)">No files saved yet. Add files from your device.</p>';
 moduleModal("My Files","Files are stored in this browser on this device using local storage. They do not sync to other devices. Keep backups of important files.",'<div id="nexusFilesList">'+render(fileRows)+'</div><div class="field"><label for="nexusFileInput">Add files</label><input id="nexusFileInput" type="file" multiple></div><button class="primary" type="button" id="saveFilesBtn">Save selected files</button><p style="font-size:10px;color:var(--muted)">Browser storage has limits. Large files may not save. Avoid storing private or sensitive documents on a shared device.</p>',()=>{});
 $("#saveModal").style.display="none";
 $("#saveFilesBtn").onclick=async()=>{const input=$("#nexusFileInput");if(!input.files.length){toast("Choose at least one file.");return}try{const db=await openFileDB();for(const file of input.files){const buffer=await file.arrayBuffer();await new Promise((resolve,reject)=>{const req=db.transaction("files","readwrite").objectStore("files").add({name:file.name,size:file.size,type:file.type,added:Date.now(),buffer});req.onsuccess=resolve;req.onerror=()=>reject(req.error)})}toast("Files saved on this device.");closeModal();openFiles()}catch(e){toast("Could not save files. Browser storage may be full.")}};
 document.querySelectorAll("[data-file-download]").forEach(b=>b.onclick=async()=>{try{const db=await openFileDB();const f=await new Promise((resolve,reject)=>{const req=db.transaction("files","readonly").objectStore("files").get(Number(b.dataset.fileDownload));req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)});if(!f)return;const url=URL.createObjectURL(new Blob([f.buffer],{type:f.type||"application/octet-stream"}));const a=document.createElement("a");a.href=url;a.download=f.name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}catch(e){toast("Could not download that file.")}});
 document.querySelectorAll("[data-file-delete]").forEach(b=>b.onclick=async()=>{try{const db=await openFileDB();await new Promise((resolve,reject)=>{const req=db.transaction("files","readwrite").objectStore("files").delete(Number(b.dataset.fileDelete));req.onsuccess=resolve;req.onerror=()=>reject(req.error)});closeModal();openFiles()}catch(e){toast("Could not delete file.")}});
}
document.querySelectorAll("[data-action]").forEach(b=>b.addEventListener("click",()=>{const name=b.dataset.action;if(name==="Weather & News")openWeather();else if(name==="AI Assistant")openAIProvider();else if(name==="My Files")openFiles();else if(name==="Tasks & Projects")openTasksManager()}));

function runSearch(){const q=$("#search").value.trim().toLowerCase();if(!q)return;const found=links.find(l=>l.name.toLowerCase().includes(q)||l.url.toLowerCase().includes(q));if(found){const url=safeUrl(found.url);if(url)window.open(url,"_blank","noopener,noreferrer");$("#recentText").textContent="Last launched: "+found.name;return}const task=tasks.find(t=>t.title.toLowerCase().includes(q));if(task){toast("Task found in My Day: "+task.title);return}toast("No matching shortcut or task yet. Try a site name or URL.")}
$("#search").addEventListener("keydown",e=>{if(e.key==="Enter")runSearch()});document.addEventListener("keydown",e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="k"){e.preventDefault();$("#search").focus();$("#search").select()}if(e.key==="Escape")closeModal()});
$("#dayLabel").textContent="TODAY";renderLinks();renderTasks();applySettings();setInterval(updateClock,15000);
if(window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches&&!settings.reducedMotion){document.querySelectorAll(".wave").forEach(w=>w.style.animation="none")}
</script>
